services:
  mindkeep:
    build:
      context: .
      # Passato dagli script di setup (git rev-parse --short HEAD) cosi' la
      # versione mostrata in app (schermata di accesso, /api/health) cambia
      # davvero a ogni aggiornamento — prima restava sempre "dev" perche'
      # nessuno lo passava mai, inutile per capire se un "docker compose up
      # --build" ha davvero preso l'ultimo codice o ha riusato una build vecchia.
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: mindkeep
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    # A differenza di "env_file", con "environment" un .env assente non blocca
    # l'avvio: senza SESSION_SECRET/ENCRYPTION_KEY il container li genera da
    # solo (vedi server/secrets.js) e li salva in ./data. Se un .env esiste,
    # Compose lo legge comunque in automatico per valorizzare queste variabili.
    environment:
      PORT: ${PORT:-3000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SESSION_DAYS: ${SESSION_DAYS:-0}
    volumes:
      - ./data:/app/data
      # Punta a un disco esterno (es. un HDD montato) impostando UPLOADS_DIR
      # nel tuo .env, es: UPLOADS_DIR=/mnt/hdd1/mindkeep-uploads
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.PORT||3000)+'/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
