<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindKeep UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Sora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="skeleton.css">
<link rel="stylesheet" href="themes/windows-95.css">
<link rel="stylesheet" href="themes/neumorphism.css">
<link rel="stylesheet" href="themes/glassmorphism.css">
<link rel="stylesheet" href="themes/macos-modern.css">
<link rel="stylesheet" href="themes/windows-11-fluent.css">
<link rel="stylesheet" href="themes/material-3.css">
<link rel="stylesheet" href="themes/neubrutalism.css">
<link rel="stylesheet" href="themes/cyberpunk.css">
<link rel="stylesheet" href="themes/minimal-flat.css">
<link rel="stylesheet" href="themes/aero-glass.css">
</head>
<body>
<div id="mk-app">
  <div id="mk-desktop">
    <div id="mk-desktop-icons">
      <button class="mk-dicon" data-open="dossiers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/></svg><span class="mk-dicon-label">Progetti</span></button>
      <button class="mk-dicon" data-open="dossiers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/></svg><span class="mk-dicon-label">Documenti</span></button>
      <button type="button" class="mk-postit" data-open="nota">Idea: rifare il sito prima di ottobre</button>
    </div>
    <div id="mk-window-layer"></div>
  </div>

  <div id="mk-taskbar">
    <button id="mk-btn-launcher" class="mk-launcher-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>Avvio</span></button>
    <div id="mk-taskbar-apps" style="display:flex;align-items:center;gap:6px;"></div>
    <div class="mk-spacer"></div>
    <div class="mk-theme-switcher">
      <label class="mk-theme-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <select id="mk-theme-select">
          <option value="windows-95">Windows 95 (riferimento)</option>
          <option value="neumorphism">Neumorphism</option>
          <option value="glassmorphism">Glassmorphism</option>
          <option value="macos-modern">macOS moderno</option>
          <option value="windows-11-fluent">Windows 11 Fluent</option>
          <option value="material-3">Material 3</option>
          <option value="neubrutalism">Neubrutalismo</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="minimal-flat">Minimal flat</option>
          <option value="aero-glass">Aero glass</option>
        </select>
      </label>
    </div>
    <div id="mk-clock" class="mk-clock"></div>
  </div>

  <div id="mk-launcher" class="mk-hidden">
    <div class="mk-launcher-sidebar">MENU</div>
    <div id="mk-launcher-items" class="mk-launcher-items"></div>
  </div>
</div>

<template id="mk-tpl-window">
  <div class="mk-win">
    <div class="mk-titlebar mk-titlebar-active">
      <span class="mk-tb-left"><span class="mk-tb-icon"></span><span class="mk-tb-title"></span></span>
      <span class="mk-tb-controls">
        <button class="mk-wctl mk-wctl-split mk-hidden" data-action="split" aria-label="Affianca un'altra app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="7"/><rect x="4" y="13" width="16" height="7"/></svg></button>
        <button class="mk-wctl mk-wctl-min" data-action="minimize" aria-label="Riduci a icona"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 18h12"/></svg></button>
        <button class="mk-wctl mk-wctl-max" data-action="maximize" aria-label="Ingrandisci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg></button>
        <button class="mk-wctl mk-wctl-close" data-action="close" aria-label="Chiudi"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </span>
    </div>
    <div class="mk-wincontent"></div>
    <div class="mk-resize-handle mk-resize-e"></div>
    <div class="mk-resize-handle mk-resize-s"></div>
    <div class="mk-resize-handle mk-resize-se"></div>
  </div>
</template>

<script src="wm.js"></script>
<script>
'use strict';
const ICONS = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12 20 3M17 6l2 2M14 9l2 2"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>',
  checkOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>',
  checkOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>',
};

function dossiersHTML() {
  const rows = [
    [ICONS.folder, 'Progetto Aurora', 'Modificato ieri · 8 file'],
    [ICONS.folder, 'Casa — Documenti', '12 file'],
    [ICONS.key, 'Password Banca', 'Vault · aggiornata 2 mesi fa'],
    [ICONS.folder, 'Fascicolo Auto', '3 allegati'],
    [ICONS.folder, 'Bozze Idee', 'Modificato ora'],
  ];
  return rows.map(([icon, title, sub]) =>
    `<div class="mk-dossier-row">${icon}<div class="mk-d-text"><span class="mk-d-title">${title}</span><span class="mk-d-sub">${sub}</span></div></div>`
  ).join('');
}

function notaHTML() {
  return `
    <h3 class="mk-note-title">Idea: rifare il sito</h3>
    <p class="mk-note-body">Homepage più chiara, aggiungere prezzi e portfolio. Sentire Marco per le foto.</p>
    <div class="mk-checklist">
      <div class="mk-check-item mk-checked">${ICONS.checkOn}<span>Wireframe homepage</span></div>
      <div class="mk-check-item mk-checked">${ICONS.checkOn}<span>Scrivere i testi</span></div>
      <div class="mk-check-item">${ICONS.checkOff}<span>Raccogliere le foto</span></div>
    </div>
    <div class="mk-tags"><span class="mk-tag">sito</span><span class="mk-tag">urgente</span></div>`;
}

function openDossiers() { MkWM.openWindow({ id: 'dossiers', title: 'Dossiers', icon: ICONS.folder, html: dossiersHTML(), defaultSize: { w: 520, h: 420 } }); }
function openNota() { MkWM.openWindow({ id: 'nota', title: 'Nota', icon: ICONS.note, html: notaHTML(), defaultSize: { w: 400, h: 360 } }); }

document.querySelectorAll('[data-open]').forEach((el) => {
  el.addEventListener('click', () => { el.dataset.open === 'dossiers' ? openDossiers() : openNota(); });
});

MkWM.setLauncherItems([
  { label: 'Dossiers', icon: ICONS.folder, onSelect: openDossiers },
  { label: 'Nota', icon: ICONS.note, onSelect: openNota },
]);

const themeSelect = document.getElementById('mk-theme-select');
const savedTheme = MkWM.getTheme() || 'windows-95';
themeSelect.value = savedTheme;
MkWM.setTheme(savedTheme);
themeSelect.addEventListener('change', () => MkWM.setTheme(themeSelect.value));

openDossiers();
openNota();
</script>
</body>
</html>
