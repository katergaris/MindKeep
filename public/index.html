<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mindkeep</title>
<meta name="theme-color" content="#008080" />
<meta name="description" content="Il tuo spazio personale: idee, progetti, password, documenti." />
<!-- Aggiunta alla schermata home del telefono -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mindkeep" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon-64.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- Scelta della lingua: solo al primissimo avvio, prima ancora che esista
     un account, quindi non puo' vivere sul server (vedi i18n.js). -->
<div id="lang-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="nest-mark" aria-hidden="true">
      <img src="/icon-192.png" width="72" height="72" alt="" />
    </div>
    <h1 data-i18n="lang_pick_title">Mindkeep</h1>
    <p class="auth-sub" data-i18n="lang_pick_sub">Scegli la lingua — Choose your language</p>
    <div class="lang-choice">
      <button type="button" class="btn btn-primary btn-block" data-lang="it">Italiano</button>
      <button type="button" class="btn btn-primary btn-block" data-lang="en">English</button>
    </div>
  </div>
</div>

<!-- Schermata di setup / login -->
<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="nest-mark" aria-hidden="true">
      <img src="/icon-192.png" width="72" height="72" alt="" />
    </div>
    <h1 id="auth-title">Mindkeep</h1>
    <p class="auth-sub" id="auth-sub">Il tuo spazio personale, al sicuro.</p>

    <form id="auth-form" class="auth-form">
      <label>
        <span data-i18n="auth_username">Username</span>
        <input type="text" id="auth-username" autocomplete="username" required />
      </label>
      <label>
        <span data-i18n="auth_password">Password</span>
        <input type="password" id="auth-password" autocomplete="current-password" required />
      </label>
      <label id="auth-code-row" class="hidden">
        <span data-i18n="auth_code">Codice di verifica</span>
        <input type="text" id="auth-code" autocomplete="one-time-code" inputmode="numeric"
               data-i18n-placeholder="auth_code_placeholder" placeholder="6 cifre dall'app" maxlength="14" />
        <span class="field-hint" data-i18n="auth_code_hint">Oppure uno dei codici di recupero, se non hai il telefono.</span>
      </label>
      <p id="auth-error" class="form-error hidden"></p>
      <button type="submit" class="btn btn-primary" id="auth-submit">Entra</button>
    </form>
    <p class="auth-version" id="auth-version"></p>
  </div>
</div>

<!-- App principale -->
<div id="app" class="app hidden">
  <!-- La ricerca parte sempre dietro l'icona in taskbar (#search-toggle):
       questa barra resta nascosta finche' non la si apre, cosi' non ruba
       spazio in cima quando non serve. -->
  <header class="topbar" id="topbar">
    <div class="search-wrap">
      <input type="text" id="global-search" data-i18n-placeholder="search_placeholder" placeholder="Cerca in tutto Mindkeep…" autocomplete="off" />
      <div id="search-results" class="search-results hidden"></div>
    </div>
  </header>

  <!-- Desktop: sfondo (scelto in Sicurezza/Impostazioni, salvato solo sul
       dispositivo), icone (Cartelle + note recenti come post-it) e finestre. -->
  <div id="desktop" class="desktop">
    <div id="desktop-wallpaper" class="desktop-wallpaper"></div>
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="window-layer" class="window-layer"></div>
  </div>

  <!-- Barra in basso: Avvio, finestre aperte, orologio. Su telefono un'app
       alla volta a schermo intero; "Affianca" (dal titlebar) ne apre una
       seconda in split solo se lo scegli tu. -->
  <div id="taskbar" class="taskbar raised">
    <button id="btn-start" class="taskbar-start raised" aria-haspopup="true" aria-expanded="false">
      <span class="taskbar-start-icon" aria-hidden="true"></span>
      <span data-i18n="taskbar_start">Avvio</span>
    </button>
    <button id="search-toggle" class="taskbar-btn raised" data-i18n-aria-label="aria_search" aria-label="Cerca" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20.5 20.5"/></svg>
    </button>
    <button id="btn-nuovo" class="taskbar-btn raised" data-i18n-title="title_quick_capture" title="Cattura veloce — sempre disponibile">
      <svg width="15" height="15" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8"><line x1="6" y1="1.5" x2="6" y2="10.5"/><line x1="1.5" y1="6" x2="10.5" y2="6"/></svg>
    </button>
    <div id="taskbar-windows" class="taskbar-windows"></div>
    <div id="taskbar-clock" class="taskbar-clock sunken"></div>
  </div>
  <div id="start-menu" class="start-menu raised hidden"></div>
  <div id="quick-capture" class="quick-capture win-frame hidden"></div>
</div>

<template id="tpl-modal">
  <div class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title"></h3>
        <button class="modal-close" data-i18n-aria-label="aria_close" aria-label="Chiudi">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
</template>

<template id="tpl-window">
  <div class="win-frame raised window">
    <div class="titlebar titlebar-active" data-drag-handle>
      <span class="titlebar-icon" aria-hidden="true"></span>
      <span class="titlebar-label"></span>
      <div class="titlebar-btns">
        <button class="win-btn win-btn-split hidden" data-action="split" data-i18n-aria-label="aria_split_app" aria-label="Affianca un'altra app">⬒</button>
        <button class="win-btn win-btn-min" data-action="minimize" data-i18n-aria-label="aria_minimize" aria-label="Riduci a icona">_</button>
        <button class="win-btn win-btn-max" data-action="maximize" data-i18n-aria-label="aria_maximize" aria-label="Ingrandisci">□</button>
        <button class="win-btn win-btn-close" data-action="close" data-i18n-aria-label="aria_close" aria-label="Chiudi">✕</button>
      </div>
    </div>
    <div class="win-content"></div>
    <div class="resize-handle resize-e"></div>
    <div class="resize-handle resize-s"></div>
    <div class="resize-handle resize-se"></div>
  </div>
</template>

<script src="/i18n.js"></script>
<script src="/wm.js"></script>
<script src="/app.js"></script>
</body>
</html>
