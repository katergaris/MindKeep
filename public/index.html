<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mindkeep</title>
<meta name="theme-color" content="#101219" />
<meta name="description" content="Il tuo spazio personale: idee, progetti, password, documenti." />
<!-- Aggiunta alla schermata home del telefono -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mindkeep" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- Schermata di setup / login -->
<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="nest-mark" aria-hidden="true">
      <img src="/icon.svg" width="72" height="72" alt="" />
    </div>
    <h1 id="auth-title">Mindkeep</h1>
    <p class="auth-sub" id="auth-sub">Il tuo spazio personale, al sicuro.</p>

    <form id="auth-form" class="auth-form">
      <label>
        Username
        <input type="text" id="auth-username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input type="password" id="auth-password" autocomplete="current-password" required />
      </label>
      <label id="auth-code-row" class="hidden">
        Codice di verifica
        <input type="text" id="auth-code" autocomplete="one-time-code" inputmode="numeric"
               placeholder="6 cifre dall'app" maxlength="14" />
        <span class="field-hint">Oppure uno dei codici di recupero, se non hai il telefono.</span>
      </label>
      <p id="auth-error" class="form-error hidden"></p>
      <button type="submit" class="btn btn-primary" id="auth-submit">Entra</button>
    </form>
  </div>
</div>

<!-- App principale -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark-box" aria-hidden="true"></span>
      <span class="brand-name" id="sidebar-brand-name">Mindkeep</span>
    </div>

    <div class="sidebar-scroll">
      <!-- Le voci vengono generate da app.js a partire da un unico elenco,
           condiviso con la barra in basso del telefono. -->
      <nav class="nav" id="nav"></nav>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-status">tutto in locale<br /><span id="sidebar-backup-note">aes-256-gcm</span></div>
      <a class="btn btn-ghost btn-block" href="/api/backup" target="_blank" rel="noopener">Esporta backup</a>
      <button class="btn btn-ghost btn-block" id="logout-btn">Esci</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar">
      <!-- Su telefono la ricerca parte come icona e si apre al tocco: a schermo
           pieno resta sempre visibile come prima. -->
      <button class="icon-btn search-toggle" id="search-toggle" aria-label="Cerca" aria-expanded="false"></button>
      <div class="search-wrap">
        <input type="text" id="global-search" placeholder="Cerca in tutto Mindkeep…" autocomplete="off" />
        <div id="search-results" class="search-results hidden"></div>
      </div>
    </header>

    <div class="crumbbar" id="crumbbar"></div>

    <section id="view-root" class="view-root">
      <!-- le view vengono renderizzate qui via JS -->
    </section>
  </main>

  <!-- Navigazione da telefono: barra fissa in basso + foglio con tutto il resto -->
  <nav class="tabbar" id="tabbar" aria-label="Sezioni"></nav>
  <div class="sheet-backdrop hidden" id="sheet-backdrop">
    <div class="sheet" id="sheet" role="dialog" aria-label="Tutte le sezioni"></div>
  </div>
</div>

<template id="tpl-modal">
  <div class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title"></h3>
        <button class="modal-close" aria-label="Chiudi">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
</template>

<script src="/app.js"></script>
</body>
</html>
